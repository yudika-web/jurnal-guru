<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jurnal Mengajar Guru SMP</title>
    <style>
        /* Gaya CSS Tetap Sama */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1, h2 { color: #2c3e50; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #34495e; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; transition: 0.3s;}
        .btn-primary { background-color: #3498db; width: 100%; }
        .btn-primary:hover { background-color: #2980b9; }
        .btn-primary:disabled { background-color: #95a5a6; cursor: not-allowed; }
        .btn-export { background-color: #27ae60; }
        .btn-export:hover { background-color: #2ecc71; }
        .btn-danger { background-color: #e74c3c; }
        .btn-danger:hover { background-color: #c0392b; }
        .btn-sm { padding: 6px 10px; font-size: 12px; border-radius: 3px; }
        .filter-section { background-color: #ecf0f1; padding: 15px; border-radius: 8px; margin-top: 20px; display: flex; flex-wrap: wrap; gap: 15px; justify-content: space-between; align-items: center;}
        .filter-group { display: flex; align-items: center; gap: 10px; }
        .filter-group select { width: auto; padding: 8px; }
        .action-group { display: flex; gap: 10px; flex-wrap: wrap; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #34495e; color: white; }
        tbody tr:nth-child(even) { background-color: #f9f9f9; }
        .empty-state { text-align: center; font-style: italic; color: #7f8c8d; }
        .loading { text-align: center; color: #3498db; font-weight: bold; padding: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Jurnal Mengajar Guru</h1>
    
    <form id="jurnalForm">
        <!-- Input Form Sama Persis -->
        <div class="form-group"><label>Tanggal</label><input type="date" id="tanggal" required></div>
        <div class="form-group"><label>Mata Pelajaran</label><select id="mapel" required><option value="">-- Pilih Mapel --</option><option value="Pendidikan Agama Islam">PAI</option><option value="Pendidikan Agama Kristen">PAK</option><option value="Pancasila">Pancasila</option><option value="Bahasa Indonesia">Bahasa Indonesia</option><option value="Matematika">Matematika</option><option value="IPA">IPA</option><option value="IPS">IPS</option><option value="Bahasa Inggris">Bahasa Inggris</option><option value="PJOK">PJOK</option><option value="Seni Budaya">Seni Budaya</option><option value="TIK">TIK</option><option value="BK">BK</option></select></div>
        <div class="form-group"><label>Kelas</label><select id="kelas" required><option value="">-- Pilih Kelas --</option><option value="7A">7A</option><option value="7B">7B</option><option value="8A">8A</option><option value="8B">8B</option><option value="9A">9A</option><option value="9B">9B</option></select></div>
        <div class="form-group"><label>Materi / Topik</label><input type="text" id="materi" required></div>
        <div class="form-group"><label>Aktivitas Siswa</label><textarea id="aktivitas" rows="3" required></textarea></div>
        <div class="form-group"><label>Catatan Guru</label><textarea id="catatan" rows="2"></textarea></div>
        <button type="submit" id="btnSimpan" class="btn-primary">Simpan Jurnal</button>
    </form>

    <hr style="margin: 30px 0; border: 1px solid #bdc3c7;">
    <h2>Riwayat & Output Jurnal</h2>
    
    <div class="filter-section">
        <div class="filter-group">
            <label>Mapel:</label>
            <select id="filterMapel" onchange="tampilkanData()">
                <option value="semua">Semua</option><option value="Pendidikan Agama Islam">PAI</option><option value="Pendidikan Agama Kristen">PAK</option><option value="Pancasila">Pancasila</option><option value="Bahasa Indonesia">Bahasa Indonesia</option><option value="Matematika">Matematika</option><option value="IPA">IPA</option><option value="IPS">IPS</option><option value="Bahasa Inggris">Bahasa Inggris</option><option value="PJOK">PJOK</option><option value="Seni Budaya">Seni Budaya</option><option value="TIK">TIK</option><option value="BK">BK</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Waktu:</label>
            <select id="filterWaktu" onchange="tampilkanData()">
                <option value="semua">Semua Waktu</option><option value="harian">Hari Ini</option><option value="mingguan">7 Hari Terakhir</option><option value="bulanan">Bulan Ini</option>
            </select>
        </div>
        <div class="action-group">
            <button class="btn-export" onclick="exportCSV()">Unduh CSV</button>
            <button class="btn-danger" onclick="hapusSemuaData()">Kosongkan Data</button>
        </div>
    </div>

    <table id="jurnalTable">
        <thead>
            <tr><th>Tanggal</th><th>Mapel</th><th>Kelas</th><th>Materi</th><th>Aktivitas</th><th>Catatan</th><th>Aksi</th></tr>
        </thead>
        <tbody>
            <tr><td colspan="7" class="loading">Memuat data dari Database... ⏳</td></tr>
        </tbody>
    </table>
</div>

<script>
    // ==========================================
    // PASTE URL WEB APP ANDA DI BAWAH INI
    // ==========================================
    const URL_GAS = "https://script.google.com/macros/s/AKfycbw7E1m_xZwMRM3l_E2tL5sBvu9UjaPhgaA91IKyIXvKdN8d9hLIfGm5-qWAm7AqIGIe/exec";
    
    const PIN_RAHASIA = "123456";
    document.getElementById('tanggal').valueAsDate = new Date();
    
    let dataJurnal = [];
    let dataYangDitampilkan = [];

    // Mengambil data saat web dibuka (Menggunakan Fetch)
    window.onload = async function() {
        try {
            const response = await fetch(URL_GAS);
            const data = await response.json();
            dataJurnal = data;
            dataJurnal.sort((a, b) => new Date(b.tanggal) - new Date(a.tanggal));
            tampilkanData();
        } catch (error) {
            console.error(error);
            document.querySelector('#jurnalTable tbody').innerHTML = '<tr><td colspan="7" class="empty-state">Gagal memuat data. Pastikan URL benar dan internet aktif.</td></tr>';
        }
    };

    // Fungsi komunikasi POST ke Google Sheets
    async function kirimDataKeSheet(payload) {
        try {
            await fetch(URL_GAS, {
                method: "POST",
                body: JSON.stringify(payload)
            });
        } catch (error) {
            console.error("Gagal sinkronisasi:", error);
            alert("Terjadi kesalahan jaringan, tapi data sementara tersimpan di layar.");
        }
    }

    // Fungsi Menyimpan Data
    document.getElementById('jurnalForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const btnSimpan = document.getElementById('btnSimpan');
        btnSimpan.innerText = "Menyimpan... ⏳";
        btnSimpan.disabled = true;

        const entriBaru = {
            action: "insert",
            id: Date.now().toString(),
            tanggal: document.getElementById('tanggal').value,
            mapel: document.getElementById('mapel').value,
            kelas: document.getElementById('kelas').value,
            materi: document.getElementById('materi').value,
            aktivitas: document.getElementById('aktivitas').value,
            catatan: document.getElementById('catatan').value || "-"
        };

        // Langsung tampil di UI
        dataJurnal.unshift(entriBaru);
        tampilkanData();

        // Proses Background ke Spreadsheet
        await kirimDataKeSheet(entriBaru);

        document.getElementById('kelas').value = "";
        document.getElementById('materi').value = "";
        document.getElementById('aktivitas').value = "";
        document.getElementById('catatan').value = "";
        
        btnSimpan.innerText = "Simpan Jurnal";
        btnSimpan.disabled = false;
    });

    // Fungsi Filter & Render Tabel
    function tampilkanData() {
        const tbody = document.querySelector('#jurnalTable tbody');
        tbody.innerHTML = '';
        
        const filterWaktu = document.getElementById('filterWaktu').value;
        const filterMapel = document.getElementById('filterMapel').value;
        const hariIniFormat = new Date().toISOString().split('T')[0];
        const hariIni = new Date(hariIniFormat);

        dataYangDitampilkan = dataJurnal.filter(item => {
            if (filterMapel !== 'semua' && item.mapel !== filterMapel) return false;
            if (filterWaktu === 'semua') return true;
            
            const tglItem = new Date(item.tanggal);
            const selisihWaktu = Math.abs(hariIni - tglItem);
            const selisihHari = Math.ceil(selisihWaktu / (1000 * 60 * 60 * 24));
            
            if (filterWaktu === 'harian') return item.tanggal === hariIniFormat;
            if (filterWaktu === 'mingguan') return selisihHari <= 7 && tglItem <= hariIni;
            if (filterWaktu === 'bulanan') return tglItem.getMonth() === hariIni.getMonth() && tglItem.getFullYear() === hariIni.getFullYear();
            
            return true;
        });

        if (dataYangDitampilkan.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" class="empty-state">Tidak ada data.</td></tr>';
            return;
        }

        dataYangDitampilkan.forEach(item => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${item.tanggal}</td>
                <td><strong>${item.mapel}</strong></td>
                <td>${item.kelas}</td>
                <td>${item.materi}</td>
                <td>${item.aktivitas}</td>
                <td>${item.catatan}</td>
                <td><button class="btn-danger btn-sm" onclick="hapusBaris('${item.id}')">Hapus</button></td>
            `;
            tbody.appendChild(tr);
        });
    }

    // Fungsi Hapus Baris
    async function hapusBaris(idItem) {
        let inputPin = prompt("Masukkan PIN untuk menghapus:");
        if (inputPin === null) return;
        
        if (inputPin === PIN_RAHASIA) {
            if (confirm("Yakin hapus data ini dari Spreadsheet?")) {
                dataJurnal = dataJurnal.filter(item => item.id !== idItem);
                tampilkanData();
                await kirimDataKeSheet({ action: "delete", id: idItem });
            }
        } else alert("PIN Salah!");
    }

    // Fungsi Kosongkan Data
    async function hapusSemuaData() {
        if (dataJurnal.length === 0) return alert("Data sudah kosong!");
        let inputPin = prompt("Masukkan PIN untuk mengosongkan SELURUH data:");
        if (inputPin === null) return;
        
        if (inputPin === PIN_RAHASIA) {
            if (confirm("⚠️ PERHATIAN!\nYakin ingin MENGHAPUS SEMUA DATA di Spreadsheet?")) {
                dataJurnal = [];
                tampilkanData();
                await kirimDataKeSheet({ action: "clear" });
            }
        } else alert("PIN Salah!");
    }

    // Export CSV
    function exportCSV() {
        if (dataYangDitampilkan.length === 0) return alert("Tidak ada data untuk diekspor!");
        let csvContent = "data:text/csv;charset=utf-8,Tanggal,Mapel,Kelas,Materi,Aktivitas,Catatan\n";
        dataYangDitampilkan.forEach(row => {
            const materiSafe = `"${String(row.materi).replace(/"/g, '""')}"`;
            const aktivitasSafe = `"${String(row.aktivitas).replace(/"/g, '""')}"`;
            const catatanSafe = `"${String(row.catatan).replace(/"/g, '""')}"`;
            csvContent += `${row.tanggal},${row.mapel},${row.kelas},${materiSafe},${aktivitasSafe},${catatanSafe}\n`;
        });
        const link = document.createElement("a");
        link.setAttribute("href", encodeURI(csvContent));
        link.setAttribute("download", "Jurnal_Guru.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>
</body>
</html>
